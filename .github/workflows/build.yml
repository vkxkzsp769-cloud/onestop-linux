name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装构建依赖
        run: |
          sudo apt-get update -qq
          # 注意：`ar` 不是独立包，属 binutils；不要写成单独包名（首次 CI 即因此失败）
          sudo apt-get install -y -qq --no-install-recommends \
            curl unzip zstd file binutils xz-utils
          echo "zstd: $(zstd --version)"
          echo "unzip: $(unzip -v | head -1)"

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'cmdline-tools;latest platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: 安装 NDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "ndk;26.1.10909125" | tail -3
          echo "--- 已安装 SDK 组件 ---"
          sdkmanager --list_installed | head -20
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: vendor Termux 终端三模块（含 AGP8 补丁）
        run: bash tools/vendor-termux.sh

      - name: 还原内置依赖（bootstrap / Ubuntu rootfs / proot）
        run: bash tools/fetch-deps.sh

      - name: 校验关键产物
        run: |
          set -e
          test -s app/src/main/assets/bootstrap/bootstrap-aarch64.zip
          test -s app/src/main/assets/rootfs/ubuntu-base-24.04.5-base-arm64.targz
          test -s app/src/main/jniLibs/arm64-v8a/libproot.so
          test -s app/src/main/jniLibs/arm64-v8a/libproot-loader.so
          test -s app/src/main/jniLibs/arm64-v8a/libtalloc.so.2
          test -s app/src/main/jniLibs/arm64-v8a/libandroid-shmem.so
          echo "--- proot 二进制架构（必须是 Android ARM64 可执行文件）---"
          file app/src/main/jniLibs/arm64-v8a/libproot.so
          readelf -h app/src/main/jniLibs/arm64-v8a/libproot.so | grep -E 'Class|Machine|Type'
          echo "--- rootfs 摘要 ---"
          ls -lh app/src/main/assets/rootfs/

      - name: 验证 tar 解析规则（对照真实 Ubuntu Base 归档）
        run: |
          set -e
          TB=ubuntu-base-24.04.5-base-arm64.tar.gz
          curl -fL --retry 3 -o "/tmp/$TB" \
            "https://cdimage.ubuntu.com/ubuntu-base/releases/24.04/release/$TB"
          echo "9c1e7b6a7c9a4f7d9e0f1a2b3c4d5e6f  dummy" >/dev/null || true
          sha256sum "/tmp/$TB"
          # 期望：a91d5a93010193712d346d761372b7c9db6dfcf093893161c64ca107f05914f2
          echo "a91d5a93010193712d346d761372b7c9db6dfcf093893161c64ca107f05914f2  /tmp/$TB" | sha256sum -c -
          python3 tools/tests/tar_extract_reference.py "/tmp/$TB"

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 构建 Debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: 构建 Release APK（未签名，供后续签名）
        run: ./gradlew --no-daemon :app:assembleRelease
        continue-on-error: true

      - name: 收集 APK 与体积报告
        run: |
          mkdir -p out
          find app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          ls -lh out/ || true
          echo "| APK | 体积 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for f in out/*.apk; do
            [ -f "$f" ] || continue
            echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: onestop-linux-apk
          path: out/*.apk
          if-no-files-found: error

      - name: 上传构建日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            **/build/reports/**
            app/build/outputs/logs/**
            app/build/tmp/kotlin-classes/**
          if-no-files-found: ignore

      - name: 编译失败时打印 Kotlin 错误摘要
        if: failure()
        run: |
          echo "=== 查找编译错误（Kotlin/Java）==="
          find . -name "*.log" -path "*build*" -exec tail -60 {} \; 2>/dev/null | grep -iE "error:|e: |Unresolved|不能" | head -60 || true
          echo "=== gradle 输出摘要 ==="
          ./gradlew --no-daemon :app:compileDebugKotlin --stacktrace 2>&1 | grep -E "^e:|error:|FAILURE|What went wrong" -A3 | head -60 || true
