name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装构建依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl unzip zstd file binutils ar >/dev/null

      - name: 设置 Android SDK（含 NDK）
        uses: android-actions/setup-android@v3

      - name: 安装 NDK 与 build-tools
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "ndk;26.1.10909125" "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1" >/dev/null

      - name: vendor Termux 终端三模块（含 AGP8 补丁）
        run: bash tools/vendor-termux.sh

      - name: 还原内置依赖（bootstrap / Ubuntu rootfs / proot）
        run: bash tools/fetch-deps.sh

      - name: 校验关键产物
        run: |
          set -e
          test -s app/src/main/assets/bootstrap/bootstrap-aarch64.zip
          test -s app/src/main/assets/rootfs/ubuntu-24.04-base-arm64.tar.zst
          test -s app/src/main/jniLibs/arm64-v8a/libproot.so
          test -s app/src/main/jniLibs/arm64-v8a/libproot-loader.so
          echo "--- proot 二进制架构（必须是 Android ARM64 可执行文件）---"
          file app/src/main/jniLibs/arm64-v8a/libproot.so
          readelf -h app/src/main/jniLibs/arm64-v8a/libproot.so | grep -E 'Class|Machine|Type'
          echo "--- rootfs 摘要 ---"
          ls -lh app/src/main/assets/rootfs/

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 构建 Debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: 构建 Release APK（未签名，供后续签名）
        run: ./gradlew --no-daemon :app:assembleRelease
        continue-on-error: true

      - name: 收集 APK 与体积报告
        run: |
          mkdir -p out
          find app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          ls -lh out/ || true
          echo "| APK | 体积 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for f in out/*.apk; do
            [ -f "$f" ] || continue
            echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: onestop-linux-apk
          path: out/*.apk
          if-no-files-found: error

      - name: 上传构建日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            **/build/reports/**
            app/build/outputs/logs/**
          if-no-files-found: ignore
